[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trampomatch"
version = "1.0.0"
description = "Plataforma de Compatibilidade para Vagas Locais"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    "email-validator>=2.1",
    "werkzeug>=3.0",
    "python-dotenv>=1.0",
    "authlib>=1.3",
    "requests>=2.31",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "black",
    "flake8",
    "invoke",
]
test = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-flask>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trampomatch*"]

[tool.pytest.ini_options]
pythonpath = ["."]
